workflows:
  pokopia-ios:
    name: Pokemon Pokopia 2.0.1 - unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "27.2"
      groups:
        - pokopia
    scripts:
      - name: Download the private NUP
        script: |
          set -euo pipefail
          : "${NUP_URL:?Set the secret NUP_URL in the pokopia environment group}"
          mkdir -p "$CM_BUILD_DIR/../pokopia/input"
          for attempt in 1 2 3; do
            echo "Downloading NUP (attempt $attempt/3)"
            if curl --fail --silent --show-error --location --retry 3 \
              --proto '=https' --proto-redir '=https' \
              --output "$CM_BUILD_DIR/../pokopia/input/Pokopia.nup.part" "$NUP_URL" &&
              PYTHONPATH="$CM_BUILD_DIR/scripts" python3 -c \
                'import sys; from pack_nup import Nup; Nup(sys.argv[1]).close()' \
                "$CM_BUILD_DIR/../pokopia/input/Pokopia.nup.part"; then
              mv "$CM_BUILD_DIR/../pokopia/input/Pokopia.nup.part" \
                "$CM_BUILD_DIR/../pokopia/input/Pokopia.nup"
              exit 0
            fi
          done
          echo "Failed to download a valid NUP after three attempts" >&2
          exit 1
      - name: Install build dependencies
        script: |
          set -euo pipefail
          brew install xcodegen zstd glslang
          python3 -m venv "$CM_BUILD_DIR/.venv"
          "$CM_BUILD_DIR/.venv/bin/python" -m pip install \
            -r "$CM_BUILD_DIR/.github/requirements/tools.txt" backports.zstd
          xcrun --sdk iphoneos --show-sdk-path
          xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk iphoneos metal --version
      - name: Build the unsigned IPA
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/artifacts"
          "$CM_BUILD_DIR/.venv/bin/python" "$CM_BUILD_DIR/scripts/build_ipa_from_nsp.py" \
            "$CM_BUILD_DIR/../pokopia/input/Pokopia.nup" \
            --title-id 0400A3A01EE4C000 --package v655360 --platform ios \
            --work-dir "$CM_BUILD_DIR/../pokopia/build" \
            --out "$CM_BUILD_DIR/artifacts/Pokopia-2.0.1.ipa" --progress lines
    artifacts:
      - artifacts/*.ipa
      - $CM_BUILD_DIR/../pokopia/build/logs/**/*.log
